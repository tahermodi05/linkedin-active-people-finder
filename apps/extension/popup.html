<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Active People Finder</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      background: #ffffff;
      color: #1f2937;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.3;
    }

    .subtitle {
      margin: 6px 0 20px;
      color: #5f6b7a;
      font-size: 14px;
      line-height: 1.45;
    }

    button {
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 6px;
      background: #0A66C2;
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
    }

    button + button {
      margin-top: 10px;
    }

    button:hover {
      background: #004182;
    }

    footer {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid #e5e7eb;
      color: #5f6b7a;
      font-size: 13px;
    }

    #status {
      color: #1f2937;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      margin-top: 14px;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 11px;
      line-height: 1.5;
      color: #111827;
      resize: vertical;
    }
  </style>
</head>
<body>
  <header>
    <h1>LinkedIn Active People Finder</h1>
    <p class="subtitle">Find active LinkedIn users from search results.</p>
  </header>

  <main>
    <button id="scanButton" type="button">Scan Current Page</button>
    <button id="viewResultsButton" type="button">View Results</button>
    <button id="captureActivityButton" type="button">Capture Activity Snapshot</button>
    <textarea id="snapshotOutput" readonly placeholder="Captured HTML will appear here."></textarea>
  </main>

  <footer>
    <span>Status: </span><span id="status">Ready</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
